# 股票评分指标权重与阈值（权重总和 100）
stocks:
  indicators:
    dividend_yield:
      weight: 15
      thresholds: { high: 4.0, mid: 2.0 }
    dividend_yield_percentile:
      weight: 10
      thresholds: { high: 70, mid: 40 }   # 当前股息率在自身近 3 年序列中的分位（%）
    dividend_years:
      weight: 15
      thresholds: { high: 5, mid: 3 }
    dividend_trend:
      weight: 10
      thresholds: { high: 0, mid: -30 }   # 近 3 年 vs 前 3 年分红变化率（%）: ≥0/≥-30/更差
    payout_ratio:
      weight: 10
      thresholds: { min: 20, max: 70 }
    pe_vs_industry:
      weight: 15
      thresholds: { discount: -30, premium: 30 }
    pb_vs_industry:
      weight: 5
      thresholds: { discount: -30, premium: 30 }
    volatility:
      weight: 15
      thresholds: { low: 20, mid: 30 }    # 年化波动率（%）越低越好：≤20/＜30 对应 1.0/0.5
    max_drawdown:
      weight: 5
      thresholds: { low: 15, mid: 25 }    # 近一年最大回撤（%）越低越好：含分红总回报口径
    # ma60_position（均线位置）与 momentum_5d（5日动量）为短线择时指标，
    # 与"长期持有、稳定优先"的目标冲突，让位于 volatility；如需可自行加回


  # 财报红标对总分的扣减（%）：四个维度各自判定，触发明细见 scorer.evaluate_sustainability
  # 每个维度只取最重一条（维度内各判据标的是同一件事，不重复计入），合计封顶 max_penalty
  #   profit    最新报告期净利润同比下滑（单期 5）；或近 repeated_periods 期中
  #             ≥repeated_min_negative 期为负（连续恶化 15）——二者只取最重一条
  #   cashflow  最近年报每股经营性现金流 ≤ 0（15）；或同季同比连续恶化（15）；
  #             或同季同比单期下滑（5）——三者只取最重一条
  #   coverage  近 12 个月分红 ÷ 经营现金流 > 100%（10）
  #   debt      资产负债率同季同比上升 ≥ debt_jump_threshold pp（10）；利息支付倍数
  #             为正且 < interest_cover_threshold（10）——二者只取最重一条（同分取前者）。
  #             不用负债率绝对水平：绝对阈值会误报银行（实测 90%+）；银行该指标
  #             「利息支付倍数」恒缺失，故天然豁免
  sustainability:
    eps_decline_penalty: 5      # 单期下滑（与连续恶化只取最重一条）
    eps_repeated_penalty: 15    # 连续恶化：窗口内 ≥repeated_min_negative 期为负
    repeated_periods: 4         # 连续恶化判定窗口（利润与现金流共用，不足 4 期不判）
    repeated_min_negative: 3
    negative_cash_penalty: 15
    cash_cover_penalty: 10
    cash_decline_penalty: 5     # 每股经营性现金流同季同比单期下滑
    cash_repeated_penalty: 15   # 每股经营性现金流同季同比连续恶化
    debt_jump_penalty: 10
    debt_jump_threshold: 10     # 资产负债率同季同比上升的 pp 阈值（含等号）
    interest_cover_penalty: 10
    interest_cover_threshold: 2.0   # 利息支付倍数（须为正）严格小于该值才触发
    max_penalty: 45

  # 风险列提示阈值（只标注、不影响分数）；波动率已成为打分指标，不在此提示
  risk_hints:
    turnover_low: 5000       # 近 60 日均成交额 < 该值（万元）→ 风险列提示

# 数据拉取参数
data:
  kline_days: 120
  pe_cache_days: 7
  financial_cache_days: 30   # 年报可持续性数据的缓存天数（季度更新）
  index_refresh_days: 14     # 成分股（dividend_index.yaml）超过该天数自动刷新
  # 取数缓存分三档（各自独立，单位见键名）；某一档设 0 = 该档每次运行都取最新：
  quote_cache_minutes: 0     # 实时档：个股/ETF 行情、最新净值（股息率与折溢价的分母）
  daily_cache_hours: 6       # 日频档：K线、基金净值、指数 PE、指数股息率、10Y 国债
  slow_cache_days: 7         # 慢变档：分红明细、基金分红、基金概况（规模/跟踪标的）
  candidate_top_n: 80        # 候选池：三个指数成分股合并去重后按总市值取前 N（0 = 不筛）；
                             # 取不到市值的成分股按严格口径剔除并告警，行情整表不可用则本轮不筛

# 输出参数
output:
  buy_top_n: 5
  avoid_bottom_n: 5
