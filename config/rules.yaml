# 股票评分指标权重与阈值（权重总和 100）
stocks:
  indicators:
    dividend_yield:
      weight: 15
      thresholds: { high: 4.0, mid: 2.0 }
    dividend_yield_percentile:
      weight: 10
      thresholds: { high: 70, mid: 40 }   # 当前股息率在自身近 3 年序列中的分位（%）
    dividend_years:
      weight: 15
      thresholds: { high: 5, mid: 3 }
    dividend_trend:
      weight: 10
      thresholds: { high: 0, mid: -30 }   # 近 3 年 vs 前 3 年分红变化率（%）: ≥0/≥-30/更差
    payout_ratio:
      weight: 10
      thresholds: { min: 20, max: 70 }
    pe_vs_industry:
      weight: 15
      thresholds: { discount: -30, premium: 30 }
    pb_vs_industry:
      weight: 10
      thresholds: { discount: -30, premium: 30 }
    volatility:
      weight: 15
      thresholds: { low: 20, mid: 30 }    # 年化波动率（%）越低越好：≤20/＜30 对应 1.0/0.5
    # ma60_position（均线位置）与 momentum_5d（5日动量）为短线择时指标，
    # 与"长期持有、稳定优先"的目标冲突，让位于 volatility；如需可自行加回


  # 财报红标对总分的扣减（%）：盈利下滑（按最新报告期同比，含中报/季报）/
  # 经营现金流为负 / 分红超现金流（两者按最近年报口径），封顶 30%
  sustainability:
    eps_decline_penalty: 10
    negative_cash_penalty: 15
    cash_cover_penalty: 10
    max_penalty: 30

  # 风险列提示阈值（只标注、不影响分数）；波动率已成为打分指标，不在此提示
  risk_hints:
    turnover_low: 5000       # 近 60 日均成交额 < 该值（万元）→ 风险列提示

# 基金评分指标权重与阈值（权重总和 100）
funds:
  indicators:
    discount_rate:
      weight: 25
      thresholds: { discount: -1, premium: 1 }
    nav_trend_20d:
      weight: 25
      thresholds: { pullback: -10, rally: 5 }
    index_pe_vs_history:
      weight: 25
      thresholds: { low: 30, high: 70 }
    dividend_frequency:
      weight: 15
      thresholds: { high: 2, mid: 1 }
    fund_size:
      weight: 10
      thresholds: { min: 1 }

# 数据拉取参数
data:
  kline_days: 120
  pe_cache_days: 7
  financial_cache_days: 30   # 年报可持续性数据的缓存天数（季度更新）
  index_refresh_days: 14     # 成分股（dividend_index.yaml）超过该天数自动刷新
  market_cache_hours: 24     # 行情/分红/净值类取数的通用缓存时长（小时），期内不再请求上游

# 输出参数
output:
  buy_top_n: 5
  avoid_bottom_n: 5
